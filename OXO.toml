# OXO.toml
#
# Configuration for OXO build
#
# (c) Andrew Shapton 2023,2026
#

title = "OXO build Configuration TOML file"

[BuildParameters]
sourceFile      = "ttt.asm"         # Source assembler file                             (Required)
assembledFile   = "ttt.exe"         # Output assembled executable file                  (Required)
prefix          = "O2"              # Prefix for the blocks                             (Required)
base            = "0200"            # Base adress for origination/load of executable    (Required)
title           = "O2O"             # Title of program for Virtual Sphere               (Required)
vcass           = "o2"              # Filename for binary Virtual Sphere cassette       
vcass2          = "o2"              # Filename for binary Virtual Sphere cassette V2      
js              = "o2"              # Filename for Javascript Virtual Sphere cassette   
cassette        = "o2"              # Filename for .wav file for cassette audio         
rom             = "NO"              # YES/NO if a ROM is being built




# (Un)comment flags as required
flags           = [
                    #"noheader",     # Don't generate a Javascript header for the Virtual Sphere
                    "movebin",      # Move the binary to the assets location post-build
                    # "silent"        # Don't produce any output (except errors)
]
[Locations]
convertEXEDir   = "/Users/andrew/MyProjects/Sphere/Tools/TOOLCHAIN/resources/"    # Location of convertEXE file
srcDir          = "/Users/andrew/MyProjects/Sphere/GAMES/GAME-TT/src"             # Location of assembler source code
outputDir       = "/Users/andrew/MyProjects/Sphere/GAMES/GAME-TT/ASSETS"         # Location of target assets
toolsDir        = "/Users/andrew/MyProjects/Sphere/GAMES/GAME-TT/tools"           # Location of supporting tools

[Miscellaneous]
buildASM        = "build.asm"       # Name of build file (with version etc inside)
buildJustify    = "C"               # Justify property for build version -  C - Centre Justified [Default]
                                    #                                       L - Left Justified
                                    #                                       R - Right Justified
NLAfterBuildVersion = true          # true to place a new line after the build version [Default]
                                    # false for no new line
                                    # NOTE - MUST BE LOWER CASE
[Symbols]
symbolFile      = "SYMBOLS.SYM"     # A symbol file generated by the assembler 
                                    # MUST be specified correctly in the assembly code
defaultSymbols  = ['START']